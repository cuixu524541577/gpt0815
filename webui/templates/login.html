<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · GPT 注册控制台</title>
  <script>
    window.GFR_I18N_BOOTSTRAP = {{ i18n_bootstrap | safe }};
  </script>
  <link rel="stylesheet" href="/static/css/app.css?v=20260717-password-login">
</head>
<body class="login-page" data-credentials-configured="{{ 'true' if credentials_configured else 'false' }}">
  <div class="locale-switch locale-switch-login" role="group" aria-label="切换界面语言" data-i18n-aria-label="language.switch_aria">
    <button type="button" data-locale-option="zh_cn" aria-pressed="true">中文</button>
    <button type="button" data-locale-option="en" aria-pressed="false">EN</button>
  </div>
  <main class="login-shell">
    <section class="login-card">
      <div class="login-brand">
        <div class="brand-mark">GFR</div>
        <div class="login-title">
          <h1 data-i18n="app.title">GPT 注册控制台</h1>
          <p data-i18n="auth.login.subtitle">选择登录方式</p>
        </div>
      </div>

      

      <div class="login-method-tabs" role="tablist" aria-label="登录方式" data-i18n-aria-label="auth.login.methods">
        <button
          type="button"
          class="login-method-tab active"
          id="passwordLoginTab"
          role="tab"
          aria-selected="true"
          aria-controls="passwordLoginPanel"
          tabindex="0"
          data-login-method="password"
          data-i18n="auth.method.password"
        >账号密码</button>
      </div>

      <section
        class="login-method-panel"
        id="registerPanel"
        role="tabpanel"
        aria-labelledby="passwordLoginTab"
        hidden
      >
        <p class="login-hint" data-i18n="auth.register.hint">首次使用：创建管理员账号（仅首次可注册）</p>
        <div class="login-alert" id="registerStatus" role="status" hidden></div>
        <form id="registerForm" class="login-password-form" novalidate>
          <label class="login-field" for="registerUsername">
            <span data-i18n="auth.register.username">管理员用户名</span>
            <input
              class="login-input"
              id="registerUsername"
              name="username"
              type="text"
              autocomplete="username"
              minlength="3"
              maxlength="32"
              required
            >
          </label>
          <label class="login-field" for="registerPassword">
            <span data-i18n="auth.register.password">密码（至少 8 位）</span>
            <input
              class="login-input"
              id="registerPassword"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              maxlength="128"
              required
            >
          </label>
          <label class="login-field" for="registerConfirmPassword">
            <span data-i18n="auth.register.confirm_password">确认密码</span>
            <input
              class="login-input"
              id="registerConfirmPassword"
              name="confirm_password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              maxlength="128"
              required
            >
          </label>
          <button
            type="submit"
            class="btn primary login-button"
            id="registerBtn"
            data-i18n="auth.register.action"
          >创建并登录</button>
        </form>
      </section>

      <section
        class="login-method-panel"
        id="passwordLoginPanel"
        role="tabpanel"
        aria-labelledby="passwordLoginTab"
        hidden
      >
        <div class="login-alert" id="passwordLoginStatus" role="status" hidden></div>
        <form id="passwordLoginForm" class="login-password-form" novalidate>
          <label class="login-field" for="loginUsername">
            <span data-i18n="auth.password.username">用户名</span>
            <input
              class="login-input"
              id="loginUsername"
              name="username"
              type="text"
              autocomplete="username"
              minlength="3"
              maxlength="32"
              required
              
            >
          </label>
          <label class="login-field" for="loginPassword">
            <span data-i18n="auth.password.password">密码</span>
            <span class="password-input-shell">
              <input
                class="login-input"
                id="loginPassword"
                name="password"
                type="password"
                autocomplete="current-password"
                minlength="8"
                maxlength="128"
                required
                
              >
              <button
                type="button"
                class="password-visibility"
                id="loginPasswordVisibility"
                aria-label="显示密码"
                title="显示密码"
                data-i18n-aria-label="auth.password.show"
                data-i18n-title="auth.password.show"
                
              >
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z" fill="none" stroke="currentColor" stroke-width="1.8"/>
                  <circle cx="12" cy="12" r="2.7" fill="none" stroke="currentColor" stroke-width="1.8"/>
                </svg>
              </button>
            </span>
          </label>
          <button
            type="submit"
            class="btn primary login-button"
            id="passwordLoginBtn"
            data-i18n="auth.password.sign_in"
            
          >登录</button>
        </form>
      </section>
    </section>
  </main>

  <script src="/static/js/i18n.js?v=20260716-i18n-foundation" defer></script>
  <script src="/static/js/pages/login.js?v=20260815-register-login" defer></script>
</body>
</html>
