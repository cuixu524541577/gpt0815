version: "3.8"

services:
  console:
    build: .
    container_name: gpt-register-console
    restart: unless-stopped
    ports:
      # 仅本地回环映射；对外访问请用 nginx 反代 + HTTPS
      - "127.0.0.1:5001:5001"
    environment:
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./data:/app/data
      - ./codex_accounts:/app/codex_accounts
      - ./注册日志:/app/注册日志
      - ./backups:/app/backups
      - ./config:/app/config
      - ./用于注册的邮箱.txt:/app/用于注册的邮箱.txt
      - ./注册成功的邮箱.txt:/app/注册成功的邮箱.txt
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/login', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
